      - name: podman copy Runtime image to Docker local repo for export
        run: |
          podman push ${{ env.WILDFLY_S2I_RUNTIME_IMAGE }}:latest-${{ matrix.jdk }}-${{ env.UBUNTU_ARCHITECTURE_IMAGE }} docker-daemon:${{ env.WILDFLY_S2I_RUNTIME_IMAGE }}:latest-${{ matrix.jdk }}
          docker save ${{ env.WILDFLY_S2I_RUNTIME_IMAGE }}:latest-${{ matrix.jdk }} | gzip > ./runtime_image_latest.tar.gz
      - name: Upload docker image tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WILDFLY_S2I_RUNTIME_IMAGE }}_latest-${{ matrix.jdk }}_${{ env.IMAGE_ID }}
          path: ./runtime_image_latest.tar.gz
          retention-days: 1
  basic_test:
    name: basic tests
    runs-on: ${{ matrix.os }}
    needs: build_builder_image
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        jdk: [jdk21, jdk25]
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python 3.x
        uses: actions/setup-python@v2
        with:
          python-version: '3.11.5'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.WILDFLY_S2I_BUILDER_IMAGE }}_latest-${{ matrix.jdk }}_${{ env.IMAGE_ID }}
          path: .
      - name: load docker image
        shell: bash
        run: |
         docker load < ./builder_image_latest.tar.gz
         docker images
      - name: Setup virtualenv and install cekit and required packages
        run: |
          python --version
          python3 -m venv ~/cekit
          ~/cekit/bin/pip install cekit docker docker-squash odcs behave lxml
      - name: install s2i binary
        run: |
          echo ===== Installing s2i from ${{ env.S2I_URL }} =====
          mkdir /tmp/s2i/ && cd /tmp/s2i/
          wget ${{ env.S2I_URI }}
           tar xvf source-to-image*.gz
           sudo mv s2i /usr/bin
           which s2i
           s2i version
      - name: Behave Tests basic
        run: |
          . ~/cekit/bin/activate
          pushd wildfly-builder-image
          cekit test --image=${{ env.WILDFLY_S2I_BUILDER_IMAGE }}:latest-${{ matrix.jdk }} behave --include-re 1-basic > test-logs-1-basic-${{ matrix.os }}-${{ matrix.jdk }}.txt 2>&1
          rm test-logs-1-basic-${{ matrix.os }}-${{ matrix.jdk }}.txt
          popd
          docker system prune -f
      - name: Advertise Failing Behave Scenarios
        if: failure()
        run: |
          pushd wildfly-builder-image
          logFile=$(find . -type f -iname "test-logs-*.txt")
          if [ -f "${logFile}" ]; then
            # Remove tar noise
            grep -v "tar.go:" ${logFile} > tmpFile && mv tmpFile ${logFile}
            # Display failing scenario
            grep -A10000 "Errored scenarios" ${logFile}
          else
            echo "No failure in behave tests"
          fi
          popd
      - name: Upload Test Reports on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wildfly-s2i-test-logs-${{ matrix.os }}-${{ matrix.jdk }}
          path: |
           wildfly-builder-image/test-logs-*.txt
           /tmp/*.wfs2i.log
