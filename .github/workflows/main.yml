name: CI on pull requests.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
env:
  LANG: en_US.UTF-8
  S2I_URI: https://github.com/openshift/source-to-image/releases/download/v1.3.1/source-to-image-v1.3.1-a5a77147-linux-amd64.tar.gz
  WILDFLY_S2I_BUILDER_IMAGE: wildfly-s2i
  WILDFLY_S2I_RUNTIME_IMAGE: wildfly-runtime
  IMAGE_ID: ${{ github.sha }}
  UBUNTU_ARCHITECTURE_IMAGE: linuxamd64
  BEHAVE_TIMEOUT: 60
jobs:
  build_builder_image:
    name: Wildfly-s2i build builder
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        jdk: [jdk21, jdk25]
    steps:
      - uses: n1hility/cancel-previous-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update hosts - linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cat /etc/hosts
          sudo bash -c "echo '127.0.0.1   localhost localhost.localdomain localhost4 localhost4.localdomain4' > /etc/hosts"
          sudo bash -c "echo '::1         localhost localhost.localdomain localhost6 localhost6.localdomain6' >> /etc/hosts"
          sudo sysctl -w fs.file-max=2097152
      - uses: actions/checkout@v2
      - name: Install qemu dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      - name: Setup required system packages
        run: |
          sudo apt-get update
          sudo apt-get install krb5-multidev libkrb5-dev
      - name: Verify latest ubi10-minimal
        run: |
          podman pull registry.access.redhat.com/ubi10/ubi-minimal
          podman image ls | grep ubi10
      - name: Setup Python 3.x
        uses: actions/setup-python@v2
        with:
          python-version: '3.11.5'
      - name: Setup virtualenv and install cekit and required packages
        run: |
          python --version
          python3 -m venv ~/cekit
          ~/cekit/bin/pip install cekit docker docker-squash odcs behave lxml
      - name: install s2i binary
        run: |
          echo ===== Installing s2i from ${{ env.S2I_URL }} =====
          mkdir /tmp/s2i/ && cd /tmp/s2i/
          wget ${{ env.S2I_URI }}
           tar xvf source-to-image*.gz
           sudo mv s2i /usr/bin
           which s2i
           s2i version
      - name: Build DockerFile file
        run: |
          echo "Docker file prior to build wildfly-s2i builder image"
          podman image ls
          . ~/cekit/bin/activate
          pushd wildfly-builder-image
          cekit build --dry-run --overrides=${{ matrix.jdk }}-overrides.yaml docker
          popd
      - name: Buildah multi archs Builder Build
        id: build_builder_image
        uses: redhat-actions/buildah-build@v2.10
        with:
          image: ${{ env.WILDFLY_S2I_BUILDER_IMAGE }}
          tags: latest-${{ matrix.jdk }}
          context: ./wildfly-builder-image/target/image
          platforms: linux/amd64, linux/arm64, linux/ppc64le
          containerfiles: |
            ./wildfly-builder-image/target/image/Dockerfile
      - name: podman copy Builder image to Docker local repo for export
        run: |
          podman push ${{ env.WILDFLY_S2I_BUILDER_IMAGE }}:latest-${{ matrix.jdk }}-${{ env.UBUNTU_ARCHITECTURE_IMAGE }} docker-daemon:${{ env.WILDFLY_S2I_BUILDER_IMAGE }}:latest-${{ matrix.jdk }}
          docker save ${{ env.WILDFLY_S2I_BUILDER_IMAGE }}:latest-${{ matrix.jdk }} | gzip > ./builder_image_latest.tar.gz
      - name: Upload docker image tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WILDFLY_S2I_BUILDER_IMAGE }}_latest-${{ matrix.jdk }}_${{ env.IMAGE_ID }}
          path: ./builder_image_latest.tar.gz
          retention-days: 1
